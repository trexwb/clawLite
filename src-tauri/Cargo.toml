[package]
name = "claw-lite"
version = "0.1.0"
edition = "2021"
description = "Claw Lite - 简易桌面 AI 助手"

[lib]
name = "claw_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
