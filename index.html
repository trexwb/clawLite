<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Claw Lite</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23E2673A'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <div id="app">
      <!-- ── 顶栏 ─────────────────────────────────────────────── -->
      <header id="topbar">
        <div class="brand">
          <!-- 品牌图标直接复用项目真实图标资源（打包同一份 build/icon.png），
               由 Vite 构建时复制到 dist/assets 下，避免出现纯色占位块 -->
          <img
            class="brand-mark"
            src="./build/icon.png"
            alt="Claw Lite 图标"
            width="26"
            height="26"
          />
          <div class="brand-text">
            <strong>Claw Lite</strong>
            <span>DeepSeek Harness 本地运行时</span>
          </div>
        </div>
        <div class="topbar-right">
          <button id="btn-update" type="button" class="btn btn-ghost btn-sm">检查更新</button>
          <span id="status-pill" class="pill">
            <span class="pill-dot"></span>
            <span id="status-text">加载中…</span>
          </span>
        </div>
      </header>

      <main>
        <!-- ── 状态主卡 ───────────────────────────────────────── -->
        <section class="card hero">
          <div class="hero-main">
            <span id="hero-dot" class="dot"></span>
            <div class="hero-text">
              <h1 id="hero-title">正在读取运行状态…</h1>
              <p id="hero-msg">—</p>
            </div>
          </div>

          <div class="hero-actions">
            <button id="btn-start" type="button" class="btn primary">启动</button>
            <button id="btn-stop" type="button" class="btn">停止</button>
            <button id="btn-restart" type="button" class="btn">重启</button>
            <span class="spacer"></span>
            <button id="btn-open-window" type="button" class="btn primary">打开界面</button>
            <button id="btn-open-browser" type="button" class="btn">浏览器打开</button>
          </div>

          <div class="hero-url">
            <span class="k">访问地址</span>
            <code id="url-text">—</code>
            <button id="btn-copy" type="button" class="btn btn-sm" disabled>复制</button>
          </div>
        </section>

        <div class="grid">
          <!-- ── 运行信息 ─────────────────────────────────────── -->
          <section class="card">
            <h2 class="card-title">运行信息</h2>
            <dl class="kv">
              <dt>运行时</dt>
              <dd id="info-runtime">—</dd>
              <dt>Node</dt>
              <dd id="info-node">—</dd>
              <dt>DSH 目录</dt>
              <dd id="info-dir" class="wrap">—</dd>
              <dt>数据目录</dt>
              <dd id="info-home" class="wrap">—</dd>
            </dl>
            <div class="card-foot">
              <span class="hint">运行时随安装包分发，无需安装 Node 环境</span>
              <button id="btn-install" type="button" class="btn btn-sm">校验运行时</button>
            </div>
          </section>

          <!-- ── 设置 ─────────────────────────────────────────── -->
          <section class="card">
            <h2 class="card-title">设置</h2>
            <div class="form">
              <label class="field">
                <span class="field-label">监听端口</span>
                <input id="f-port" type="number" min="1024" max="65535" step="1" />
              </label>

              <label class="field">
                <span class="field-label">打开方式</span>
                <select id="f-open-mode">
                  <option value="window">应用内独立窗口</option>
                  <option value="browser">系统浏览器</option>
                </select>
              </label>

              <label class="field">
                <span class="field-label">工作目录</span>
                <span class="row">
                  <input id="f-workspace" type="text" spellcheck="false" autocomplete="off" />
                  <button id="btn-pick-ws" type="button" class="btn btn-sm">选择</button>
                </span>
              </label>

              <label class="field">
                <span class="field-label">DSH_HOME（可选）</span>
                <input
                  id="f-dsh-home"
                  type="text"
                  placeholder="留空使用应用数据目录"
                  spellcheck="false"
                  autocomplete="off"
                />
              </label>

              <label class="check">
                <input id="f-auto" type="checkbox" />
                <span>应用启动时自动运行 DSH</span>
              </label>
            </div>
            <div class="card-foot">
              <span id="save-hint" class="hint"></span>
              <button id="btn-save" type="button" class="btn primary btn-sm">保存设置</button>
            </div>
          </section>
        </div>

        <!-- ── 日志 ───────────────────────────────────────────── -->
        <section class="card">
          <div class="card-head">
            <h2 class="card-title">运行日志</h2>
            <div class="card-head-actions">
              <label class="check small">
                <input id="f-autoscroll" type="checkbox" checked />
                <span>自动滚动</span>
              </label>
              <button id="btn-clear-log" type="button" class="btn btn-sm">清屏</button>
            </div>
          </div>
          <pre id="log" class="log">（暂无日志）</pre>
        </section>
      </main>

      <footer id="foot">
        <span>Claw Lite · Electron + 内置 DSH 运行时，用户无需安装 Node 环境</span>
        <span id="foot-version"></span>
      </footer>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
