<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Claw Lite</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23C8501B'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <div id="app">
      <!-- 左侧栏 -->
      <aside id="sidebar">
        <div class="brand">
          <span class="brand-name">Claw Lite</span>
          <span class="brand-dot"></span>
        </div>
        <button id="btn-new-task" type="button">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          <span>新任务</span>
        </button>
        <ul id="session-list"></ul>
        <div class="sidebar-footer">
          <button id="btn-workspace" type="button" title="工作目录">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            <span id="workspace-label">未设置工作目录</span>
          </button>
          <button id="btn-settings" type="button" class="icon-btn" title="设置" aria-label="设置">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
        </div>
      </aside>

      <!-- 主区 -->
      <main>
        <header id="topbar">
          <h1 id="session-title">新任务</h1>
          <span id="ws-chip" class="warn" title="点击设置工作目录">未设置工作目录</span>
        </header>
        <section id="chat-scroll">
          <div class="chat-col" id="chat-col"></div>
        </section>
        <footer id="composer">
          <div class="composer-card">
            <textarea id="input" rows="1" placeholder="给 Claw Lite 派个任务…" autocomplete="off"></textarea>
            <button id="btn-send" type="button" title="发送（Enter）" aria-label="发送">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 22-7z"/></svg>
            </button>
            <button id="btn-stop" type="button" class="hidden" title="停止" aria-label="停止">
              <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor" stroke="none"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/></svg>
            </button>
          </div>
        </footer>
      </main>
    </div>

    <!-- 设置弹窗 -->
    <div id="settings-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
      <div class="modal-card">
        <header class="modal-head">
          <h2>设置</h2>
          <button id="settings-close" type="button" class="icon-btn" title="关闭" aria-label="关闭">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </header>
        <div class="modal-body">
          <label class="field">
            <span class="field-label"><span>API Key</span></span>
            <span class="field-row">
              <input id="set-apikey" type="password" placeholder="sk-…" autocomplete="off" spellcheck="false" />
              <button id="set-key-eye" type="button" class="icon-btn" title="显示 / 隐藏" aria-label="显示或隐藏 API Key"></button>
            </span>
          </label>
          <label class="field">
            <span class="field-label"><span>API 地址</span></span>
            <input id="set-apibase" type="text" placeholder="https://api.deepseek.com" autocomplete="off" spellcheck="false" />
          </label>
          <label class="field">
            <span class="field-label"><span>模型</span></span>
            <select id="set-model">
              <option value="deepseek-chat">deepseek-chat</option>
              <option value="deepseek-reasoner">deepseek-reasoner</option>
              <option value="__custom__">自定义…</option>
            </select>
            <input id="set-model-custom" type="text" class="hidden" placeholder="输入自定义模型名" autocomplete="off" spellcheck="false" />
          </label>
          <label class="field">
            <span class="field-label"><span>温度</span><span id="set-temp-val" class="field-value">0.7</span></span>
            <input id="set-temp" type="range" min="0" max="2" step="0.1" />
          </label>
          <label class="field">
            <span class="field-label"><span>工作目录</span></span>
            <span class="field-row">
              <input id="set-workspace" type="text" placeholder="/Users/you/项目目录" autocomplete="off" spellcheck="false" />
              <button id="set-pick" type="button" class="btn">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                <span>选择目录</span>
              </button>
            </span>
          </label>
        </div>
        <footer class="modal-foot">
          <button id="btn-test" type="button" class="btn push">测试连接</button>
          <button id="btn-save" type="button" class="btn primary">保存</button>
        </footer>
      </div>
    </div>

    <!-- 确认弹窗 -->
    <div id="confirm-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
      <div class="modal-card modal-sm">
        <h3 id="confirm-title">确认操作</h3>
        <p id="confirm-detail"></p>
        <footer class="modal-foot">
          <button id="confirm-cancel" type="button" class="btn">取消</button>
          <button id="confirm-ok" type="button" class="btn primary">确认</button>
        </footer>
      </div>
    </div>

    <div id="toast" class="hidden"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
