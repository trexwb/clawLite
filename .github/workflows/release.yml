name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 构建 ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS (arm64)
            args: --mac
          - os: windows-latest
            label: Windows (x64)
            args: --win
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 把内置 DSH 依赖树拉到 resources/dsh（各平台必须在自己的构建机上安装，
      # 依赖树含 node-pty / sharp 等平台相关原生模块）
      - name: 拉取内置 DSH 运行时
        run: npm run runtime

      - name: 静态自检
        run: npm run check

      - name: 构建渲染进程
        run: npm run build:web

      - name: 打包安装程序
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: clawlite-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest*.yml

  publish:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 收集各平台产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          draft: false
          generate_release_notes: true
