appId: com.trexwb.clawlite
productName: Claw Lite
copyright: Copyright © 2026 trexwb

directories:
  output: release
  buildResources: build

# 只打包构建产物：渲染层 dist/ 与主进程 dist-electron/（.ts 源码不随包分发）；
# DSH 运行时走 extraResources
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - "!**/*.{map,md,ts,tsx}"

# DSH 依赖树随包分发（约 280MB），置于 Resources/dsh，
# 不打进 asar：内含原生模块（.node）需以真实文件形式存在。
# 排除 node/node.exe —— Electron 自带 Node 运行时，无需外挂解释器。
# 同时作为「离线兜底」：运行时若无法联网拉取最新版，回退至此内置版本。
extraResources:
  - from: resources/dsh
    to: dsh
    filter:
      - "**/*"
      - "!node"
      - "!node.exe"
  # npm 随包内置（resourcesPath/npm），供运行时在 userData 拉取/安装指定 DSH 版本，
  # 不依赖用户系统装有 npm / Node。version-fetch.ts 的 resolveNpmCli 优先取此处。
  - from: node_modules/npm
    to: npm
    filter:
      - "**/*"

asar: true
compression: maximum

mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  # 产物名统一用连字符：含空格的名称在 GitHub Release 下载 URL 中会被转义 / 替换，
  # 导致 electron-updater 按清单里的 url 下载时 404。productName 仍保留空格（仅显示用）。
  artifactName: Claw-Lite-${version}-${arch}.${ext}
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
    - target: zip

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  icon: build/icon.png
  artifactName: Claw-Lite-Setup-${version}.${ext}
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Claw Lite

linux:
  icon: build/icon.png
  category: Development
  artifactName: Claw-Lite-${version}-${arch}.${ext}
  target:
    - AppImage

publish:
  provider: github
  owner: trexwb
  repo: clawLite
